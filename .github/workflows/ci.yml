name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run --frozen ruff check . ../scripts/seed.py ../scripts/check_release.py

      - name: Ruff format
        run: uv run --frozen ruff format --check . ../scripts/seed.py ../scripts/check_release.py

      - name: Unit tests
        run: uv run --frozen pytest -m "not integration"

      - name: Phase 2 tests
        run: uv run --frozen pytest -m phase2

      - name: Phase 5 tests
        run: uv run --frozen pytest -m phase5

      - name: Alembic history is linear and reversible
        # Одна голова: две ветки миграций молча расходятся на проде.
        run: |
          heads="$(uv run --frozen alembic heads | grep -c . || true)"
          if [[ "$heads" != "1" ]]; then
            echo "::error::alembic must have exactly one head, found $heads"
            uv run --frozen alembic heads
            exit 1
          fi
          uv run --frozen alembic history --verbose > /dev/null

      - name: Validate seed data
        run: uv run --frozen python ../scripts/seed.py --validate

      - name: Scan tracked files for secrets
        run: uv run --frozen pytest tests/test_secrets.py -q

      - name: Generate OpenAPI schema
        run: >-
          uv run --frozen python -c
          'import json; from app.main import create_app;
          print(json.dumps(create_app().openapi()))'
          > "$RUNNER_TEMP/quack-openapi.json"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend type generator
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Check frontend API types
        working-directory: .
        run: |
          if [[ ! -f frontend/src/api/schema.d.ts ]]; then
            echo "::error::Frontend API schema.d.ts is missing"
            exit 1
          fi
          make types
          git diff --exit-code -- frontend/src/api/schema.d.ts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build (same flags as Dockerfile.web)
        env:
          NEXT_PUBLIC_DATA_SOURCE: remote
          NEXT_PUBLIC_API_URL: /api
        run: npm run build
