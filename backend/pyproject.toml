[project]
name = "quack"
version = "0.1.0"
description = "Quack backend: event log, projector, jobs and LLM gateway"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5.0",
    "authlib>=1.9.2",
    "fastapi>=0.162.0",
    "fsrs==6.3.2",
    "genanki>=0.13.1",
    "httpx>=0.28.1",
    "langchain-core>=1.7.4",
    "langgraph>=1.2.19",
    "modal>=1.6.3",
    "msgpack>=1.2.4",
    "neo4j>=5.20",
    "openai>=3.42.0",
    "orjson>=3.13.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "redis>=5.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "jsonschema>=4.26.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]
loadtest = [
    "locust>=2.47.0",
]

[tool.uv]
package = false
# pyright checks loadtest/ (WP10.3); images install without these groups.
default-groups = ["dev", "loadtest"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["quack", "tests", "loadtest"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
