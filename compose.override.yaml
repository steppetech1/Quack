# Local development only (Д-§2.1, Д-§3.2): databases and the API on 127.0.0.1. A service only on
# the `internal` network cannot publish a port, so the published ones also join `local`.

services:
  postgres:
    networks: [backend, local]
    ports: ["127.0.0.1:5432:5432"]
  neo4j:
    networks: [backend, local]
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
  redis:
    networks: [backend, local]
    ports: ["127.0.0.1:6379:6379"]
  api:
    ports: ["127.0.0.1:8000:8000"]
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-quack}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-quack12345}
  workers:
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-quack}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-quack12345}

  # Local S3-compatible storage for `s3_bucket_learners` (Д-§8.4, WP19), so canvas strokes and
  # other learner objects actually persist on a local stand instead of only not crashing
  # (REPORT_CANVAS_STROKES_AND_TEACHER_VISION.md recommendation 1). Real deployments set
  # S3_ENDPOINT/S3_ACCESS_KEY/S3_SECRET_KEY to a real S3-compatible provider instead.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks: [backend, local]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    environment:
      MINIO_ROOT_USER: quack
      MINIO_ROOT_PASSWORD: quack12345
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    networks: [backend, local]
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 quack quack12345; do sleep 1; done &&
      mc mb -p local/quack-learners || true"

networks:
  local: {}

volumes:
  minio-data: {}
