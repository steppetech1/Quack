# Local development only (Д-§2.1, Д-§3.2): databases and the API on 127.0.0.1. A service only on
# the `internal` network cannot publish a port, so the published ones also join `local`.

services:
  postgres:
    networks: [backend, local]
    ports: ["127.0.0.1:5432:5432"]
  neo4j:
    networks: [backend, local]
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
  redis:
    networks: [backend, local]
    ports: ["127.0.0.1:6379:6379"]
  api:
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./backend/quack:/app/quack
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-quack}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-quack12345}
      # Signed links (canvas replay, exports, materials) go to the browser: it reaches MinIO at the
      # published port, not at the container name the API itself uses.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      # The canvas WebSocket refuses a browser `Origin` outside `cors_origins` (cross-site hijack
      # guard); the default list holds only the production hosts, so on a local stand the page at
      # localhost:3000 got 403 and the board neither saved strokes nor heard the teacher.
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
      SESSION_COOKIE_DOMAIN: "${SESSION_COOKIE_DOMAIN:-}"
      AUTH_SUCCESS_REDIRECT_URL: "${AUTH_SUCCESS_REDIRECT_URL:-http://localhost:3000/}"
      GOOGLE_OIDC_REDIRECT_URL: "${GOOGLE_OIDC_REDIRECT_URL:-http://localhost:3000/api/auth/google/callback}"
  # compute runs the code of the working tree too (a new endpoint, such as the one that reads a
  # presentation, would not exist in the image until a rebuild).
  compute:
    volumes:
      - ./compute/quack_compute:/app/quack_compute:ro
  # The code of the background processes comes from the working tree like the API's: the dispatcher
  # (`projector`) and the job handlers (`workers`) otherwise run the code baked into the image, and a
  # change to a rule or a handler would not reach them until a rebuild.
  projector:
    volumes:
      - ./backend/quack:/app/quack
  workers:
    volumes:
      - ./backend/quack:/app/quack
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-quack}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-quack12345}

  # Local S3-compatible storage for `s3_bucket_learners` (Д-§8.4, WP19), so canvas strokes and
  # other learner objects actually persist on a local stand instead of only not crashing
  # (REPORT_CANVAS_STROKES_AND_TEACHER_VISION.md recommendation 1). Real deployments set
  # S3_ENDPOINT/S3_ACCESS_KEY/S3_SECRET_KEY to a real S3-compatible provider instead.
  minio:
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    networks: [backend, local]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    environment:
      MINIO_ROOT_USER: quack
      MINIO_ROOT_PASSWORD: quack12345
      MINIO_DEFAULT_BUCKETS: quack-learners
    volumes:
      - minio-data:/bitnami/minio/data

networks:
  local: {}

volumes:
  minio-data: {}
