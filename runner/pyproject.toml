[project]
name = "quack-runner"
version = "0.1.0"
description = "Quack runner: learner code (Python, SQLite) in a sandbox (POST /v1/run/python, /v1/run/sql)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "pyright",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["quack_runner", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
# The service runs on Linux only (setuid, rlimits); a Windows checkout type-checks as Linux.
pythonPlatform = "Linux"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "sandbox: needs the real sandbox (Linux, root with SETUID/SETGID, slot directories); run in the runner image",
]
